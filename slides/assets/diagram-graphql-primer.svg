<text x="44" y="59" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="24" font-weight="700" fill="#fff">POST /graphql</text>
<text x="44" y="116" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="22" font-weight="700" fill="#061A40" xml:space="preserve">query {</text>
