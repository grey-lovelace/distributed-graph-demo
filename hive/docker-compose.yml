# The self-hosted Hive schema registry.
#
# This file is Hive's official docker/docker-compose.community.yml from release hive@12.1.0:
#   https://github.com/graphql-hive/console/blob/hive%4012.1.0/docker/docker-compose.community.yml
#
# The root docker-compose.yml includes this file. The settings come from hive.env.
#
# This copy has four changes from the original:
#   1. Hive uses the same Docker network as the demo services, so Hive's custom "stack" network is removed.
#   2. The data is stored in named Docker volumes instead of ./.hive bind mounts.
#      With bind mounts, Redis could not write to its data folder.
#   3. The Redpanda (9092, 9644), S3 (9000, 9001) and usage (8081) ports are not published to the host.
#      Only Hive's own containers and the router use them.
#   4. The volumes section at the end declares the named volumes.
# It also adds a comment above each service that explains what the service does.
#
# Hive publishes these ports on the host:
#   8080  The Hive web app
#   8082  The Hive GraphQL API, and the artifact endpoint that serves the supergraph
#   8083  A proxy to Hive's S3 storage

services:
  # Postgres stores Hive's main records: users, organizations, projects, targets,
  # access tokens, every published schema version, and schema check results.
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: '${POSTGRES_DB}'
      POSTGRES_USER: '${POSTGRES_USER}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
      PGDATA: /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}']
      interval: 5s
      timeout: 5s
      retries: 6
    volumes:
      - hive-postgres:/var/lib/postgresql/data

  # ClickHouse is an analytics database. It stores one row for each operation the router
  # reports, with the fields, client and latency. The Insights pages read it, and schema checks
  # use it to find which clients use a field. The server also writes audit log entries here.
  clickhouse:
    image: clickhouse/clickhouse-server:26.3.12.3-alpine
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://0.0.0.0:8123/ping']
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 10s
    environment:
      CLICKHOUSE_USER: '${CLICKHOUSE_USER}'
      CLICKHOUSE_PASSWORD: '${CLICKHOUSE_PASSWORD}'
    volumes:
      - hive-clickhouse:/var/lib/clickhouse

  # Redpanda is a Kafka-compatible message broker. It queues usage reports between
  # the usage service, which receives them, and the usage-ingestor, which stores them.
  broker:
    image: redpandadata/redpanda:v23.3.21
    hostname: broker
    command:
      - redpanda
      - start
      - --smp
      - '1'
      - --set redpanda.empty_seed_starts_cluster=false
      - --seeds "redpanda-1:33145"
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://broker:29092,OUTSIDE://localhost:9092
      - --pandaproxy-addr
      - PLAINTEXT://0.0.0.0:27082,OUTSIDE://0.0.0.0:7082
      - --advertise-pandaproxy-addr
      - PLAINTEXT://broker:27082,OUTSIDE://localhost:7082
      - --advertise-rpc-addr redpanda-1:33145
    mem_limit: 300m
    mem_reservation: 100m
    healthcheck:
      test: 'curl -f http://localhost:9644/public_metrics'
      interval: 3s
      timeout: 3s
      retries: 6
      start_period: 5s
    volumes:
      - hive-broker:/var/lib/redpanda/data

  # Redis holds short-lived cache data that the Hive services share.
  redis:
    image: bitnamilegacy/redis:7.4.2
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 10s
      retries: 6
      start_period: 5s
    environment:
      REDIS_PASSWORD: '${REDIS_PASSWORD}'
      REDIS_DISABLE_COMMANDS: 'FLUSHDB,FLUSHALL'
    volumes:
      - hive-redis:/bitnami/redis/data

  # An S3-compatible file store. Hive writes the composed supergraph and other schema files
  # here. The server's artifact endpoint reads them when the router asks for the supergraph.
  s3:
    image: ghcr.io/versity/versitygw:v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        mkdir -p /data/artifacts /data/audit-logs /metadata && exec /usr/local/bin/versitygw --port
        :9000 --webui :9001 --webui-no-tls --region us-east-1 --health /minio/health/live
        --disable-acl posix --sidecar /metadata /data
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 20s
      retries: 3
    environment:
      ROOT_ACCESS_KEY: ${S3_ROOT_USER}
      ROOT_SECRET_KEY: ${S3_ROOT_PASSWORD}
    volumes:
      - hive-s3-data:/data
      - hive-s3-metadata:/metadata

  # A proxy that exposes the S3 store on localhost:8083. Hive's official file includes it.
  # The demo does not use it directly.
  s3_reverse_proxy:
    image: caddy:2.9.1-alpine
    depends_on:
      s3:
        condition: service_healthy
    ports:
      - '8083:8083'
    command: caddy reverse-proxy --from :8083 --to s3:9000 --change-host-header

  # Runs once at startup. It creates and updates the tables in Postgres and ClickHouse, then exits.
  migrations:
    image: '${DOCKER_REGISTRY}storage${DOCKER_TAG}'
    depends_on:
      clickhouse:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      MIGRATOR: 'up'
      CLICKHOUSE_MIGRATOR: 'up'
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: '${POSTGRES_DB}'
      POSTGRES_USER: '${POSTGRES_USER}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
      CLICKHOUSE_PROTOCOL: 'http'
      CLICKHOUSE_HOST: 'clickhouse'
      CLICKHOUSE_PORT: '8123'
      CLICKHOUSE_USERNAME: '${CLICKHOUSE_USER}'
      CLICKHOUSE_PASSWORD: '${CLICKHOUSE_PASSWORD}'
      CLICKHOUSE_TTL_TABLES: '${CLICKHOUSE_TTL_TABLES:-}'
      CLICKHOUSE_TTL_DAILY_MV_TABLES: '${CLICKHOUSE_TTL_DAILY_MV_TABLES:-}'
      CLICKHOUSE_TTL_HOURLY_MV_TABLES: '${CLICKHOUSE_TTL_HOURLY_MV_TABLES:-}'
      CLICKHOUSE_TTL_MINUTELY_MV_TABLES: '${CLICKHOUSE_TTL_MINUTELY_MV_TABLES:-}'
      TS_NODE_TRANSPILE_ONLY: 'true'
      LOG_LEVEL: '${LOG_LEVEL:-debug}'

  # The Hive API. The web app and the Hive CLI call its GraphQL endpoint to sign in,
  # publish schemas and run schema checks. The router downloads the supergraph from its
  # artifact endpoint, /artifacts/v1/<target ID>/supergraph.
  server:
    image: '${DOCKER_REGISTRY}server${DOCKER_TAG}'
    depends_on:
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      s3:
        condition: service_healthy
      schema:
        condition: service_healthy
      policy:
        condition: service_healthy
    ports:
      - '8082:3001'
    environment:
      NODE_ENV: production
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: '${POSTGRES_DB}'
      POSTGRES_USER: '${POSTGRES_USER}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
      CLICKHOUSE_PROTOCOL: 'http'
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USERNAME: '${CLICKHOUSE_USER}'
      CLICKHOUSE_PASSWORD: '${CLICKHOUSE_PASSWORD}'
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: '${REDIS_PASSWORD}'
      SCHEMA_ENDPOINT: http://schema:3002
      SCHEMA_POLICY_ENDPOINT: http://policy:3012
      ENCRYPTION_SECRET: '${HIVE_ENCRYPTION_SECRET}'
      WEB_APP_URL: '${HIVE_APP_BASE_URL}'
      PORT: 3001
      SERVER_HOST: '${SERVER_HOST:-::}'
      SERVER_HOST_IPV6_ONLY: '${SERVER_HOST_IPV6_ONLY:-0}'
      S3_ENDPOINT: 'http://s3:9000'
      S3_ACCESS_KEY_ID: ${S3_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${S3_ROOT_PASSWORD}
      S3_BUCKET_NAME: artifacts
      S3_AUDIT_LOG_ENDPOINT: 'http://s3:9000'
      S3_AUDIT_LOG_ACCESS_KEY_ID: ${S3_ROOT_USER}
      S3_AUDIT_LOG_SECRET_ACCESS_KEY: ${S3_ROOT_PASSWORD}
      S3_AUDIT_LOG_BUCKET_NAME: audit-logs
      CDN_AUTH_PRIVATE_KEY: ${CDN_AUTH_PRIVATE_KEY}
      CDN_API: '1'
      CDN_API_BASE_URL: 'http://localhost:8082'
      LOG_LEVEL: '${LOG_LEVEL:-debug}'
      # Auth
      AUTH_ORGANIZATION_OIDC: '1'
      AUTH_REQUIRE_EMAIL_VERIFICATION: '0'
      GRAPHQL_PUBLIC_ORIGIN: http://localhost:8082
      SUPERTOKENS_REFRESH_TOKEN_KEY: '${SUPERTOKENS_REFRESH_TOKEN_KEY}'
      SUPERTOKENS_ACCESS_TOKEN_KEY: '${SUPERTOKENS_ACCESS_TOKEN_KEY}'
      # Tracing
      OPENTELEMETRY_COLLECTOR_ENDPOINT: '${OPENTELEMETRY_COLLECTOR_ENDPOINT:-}'
      SENTRY: '${SENTRY:-0}'
      SENTRY_DSN: '${SENTRY_DSN:-}'
      PROMETHEUS_METRICS: '${PROMETHEUS_METRICS:-}'

  # Runs schema policy rules during schema checks, such as naming conventions for fields.
  policy:
    image: '${DOCKER_REGISTRY}policy${DOCKER_TAG}'
    environment:
      NODE_ENV: production
      PORT: 3012
      SERVER_HOST: '${SERVER_HOST:-::}'
      SERVER_HOST_IPV6_ONLY: '${SERVER_HOST_IPV6_ONLY:-0}'
      LOG_LEVEL: '${LOG_LEVEL:-debug}'
      OPENTELEMETRY_COLLECTOR_ENDPOINT: '${OPENTELEMETRY_COLLECTOR_ENDPOINT:-}'
      SENTRY: '${SENTRY:-0}'
      SENTRY_DSN: '${SENTRY_DSN:-}'
      PROMETHEUS_METRICS: '${PROMETHEUS_METRICS:-}'

  # Validates subgraph schemas and composes them into the supergraph.
  # The server calls it on every publish and every schema check.
  schema:
    image: '${DOCKER_REGISTRY}schema${DOCKER_TAG}'
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3002
      SERVER_HOST: '${SERVER_HOST:-::}'
      SERVER_HOST_IPV6_ONLY: '${SERVER_HOST_IPV6_ONLY:-0}'
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: '${REDIS_PASSWORD}'
      ENCRYPTION_SECRET: '${HIVE_ENCRYPTION_SECRET}'
      OPENTELEMETRY_COLLECTOR_ENDPOINT: '${OPENTELEMETRY_COLLECTOR_ENDPOINT:-}'
      SENTRY: '${SENTRY:-0}'
      SENTRY_DSN: '${SENTRY_DSN:-}'
      PROMETHEUS_METRICS: '${PROMETHEUS_METRICS:-}'
      LOG_LEVEL: '${LOG_LEVEL:-debug}'

  # Runs background jobs, such as sending emails and webhooks.
  workflows:
    image: '${DOCKER_REGISTRY}workflows${DOCKER_TAG}'
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3014
      SERVER_HOST: '${SERVER_HOST:-::}'
      SERVER_HOST_IPV6_ONLY: '${SERVER_HOST_IPV6_ONLY:-0}'
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: '${POSTGRES_DB}'
      POSTGRES_USER: '${POSTGRES_USER}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
      EMAIL_FROM: no-reply@graphql-hive.com
      EMAIL_PROVIDER: sendmail
      LOG_LEVEL: '${LOG_LEVEL:-debug}'
      SENTRY: '${SENTRY:-0}'
      SENTRY_DSN: '${SENTRY_DSN:-}'
      PROMETHEUS_METRICS: '${PROMETHEUS_METRICS:-}'
      LOG_JSON: '1'
      SCHEMA_ENDPOINT: http://schema:3002
      WEB_APP_URL: '${HIVE_APP_BASE_URL}'
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: '${REDIS_PASSWORD}'
      ENCRYPTION_SECRET: '${HIVE_ENCRYPTION_SECRET}'

  # Receives the usage reports that the router sends, checks the access token,
  # and puts the reports on the Redpanda broker.
  usage:
    image: '${DOCKER_REGISTRY}usage${DOCKER_TAG}'
    depends_on:
      broker:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      KAFKA_CONNECTION_MODE: 'docker'
      KAFKA_TOPIC: 'usage_reports_v2'
      KAFKA_BROKER: broker:29092
      KAFKA_BUFFER_SIZE: 350
      KAFKA_BUFFER_INTERVAL: 1000
      KAFKA_BUFFER_DYNAMIC: '1'
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: '${POSTGRES_DB}'
      POSTGRES_USER: '${POSTGRES_USER}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: '${REDIS_PASSWORD}'
      PORT: 3006
      SERVER_HOST: '${SERVER_HOST:-::}'
      SERVER_HOST_IPV6_ONLY: '${SERVER_HOST_IPV6_ONLY:-0}'
      LOG_LEVEL: '${LOG_LEVEL:-debug}'
      SENTRY: '${SENTRY:-0}'
      SENTRY_DSN: '${SENTRY_DSN:-}'
      PROMETHEUS_METRICS: '${PROMETHEUS_METRICS:-}'

  # Reads usage reports from the Redpanda broker and writes them to ClickHouse.
  usage-ingestor:
    image: '${DOCKER_REGISTRY}usage-ingestor${DOCKER_TAG}'
    depends_on:
      broker:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      NODE_ENV: production
      KAFKA_CONNECTION_MODE: 'docker'
      KAFKA_BROKER: broker:29092
      KAFKA_CONCURRENCY: '1'
      KAFKA_CONSUMER_GROUP: 'usage-ingestor-v2'
      KAFKA_TOPIC: 'usage_reports_v2'
      CLICKHOUSE_PROTOCOL: 'http'
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USERNAME: '${CLICKHOUSE_USER}'
      CLICKHOUSE_PASSWORD: '${CLICKHOUSE_PASSWORD}'
      PORT: 3007
      SERVER_HOST: '${SERVER_HOST:-::}'
      SERVER_HOST_IPV6_ONLY: '${SERVER_HOST_IPV6_ONLY:-0}'
      LOG_LEVEL: '${LOG_LEVEL:-debug}'
      SENTRY: '${SENTRY:-0}'
      SENTRY_DSN: '${SENTRY_DSN:-}'
      PROMETHEUS_METRICS: '${PROMETHEUS_METRICS:-}'

  # The Hive web app at http://localhost:8080.
  app:
    image: '${DOCKER_REGISTRY}app${DOCKER_TAG}'
    ports:
      - '8080:3000'
    environment:
      PORT: 3000
      SERVER_HOST: '${SERVER_HOST:-::}'
      SERVER_HOST_IPV6_ONLY: '${SERVER_HOST_IPV6_ONLY:-0}'
      NODE_ENV: production
      APP_BASE_URL: '${HIVE_APP_BASE_URL}'
      GRAPHQL_PUBLIC_ENDPOINT: http://localhost:8082/graphql
      GRAPHQL_PUBLIC_SUBSCRIPTION_ENDPOINT: http://localhost:8082/graphql
      GRAPHQL_PUBLIC_ORIGIN: http://localhost:8082
      AUTH_REQUIRE_EMAIL_VERIFICATION: '0'
      AUTH_ORGANIZATION_OIDC: '1'
      LOG_LEVEL: '${LOG_LEVEL:-debug}'
      SENTRY: '${SENTRY:-0}'
      SENTRY_DSN: '${SENTRY_DSN:-}'

volumes:
  hive-postgres:
  hive-clickhouse:
  hive-broker:
  hive-redis:
  hive-s3-data:
  hive-s3-metadata:
