# Publishes the slides/ folder to GitHub Pages whenever the slides change on main.
# Before the first run, set Settings > Pages > Source to "GitHub Actions".
name: Publish slides

on:
  push:
    branches: [main]
    paths: ["slides/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: slides
      - id: deployment
        uses: actions/deploy-pages@v4
